<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wartezimmer</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background:#0b1220; color:#e2e8f0; overflow:hidden; }
    .screen { height:100vh; display:flex; flex-direction:column; }
    .dhead { display:flex; align-items:center; justify-content:space-between; padding:22px 40px; border-bottom:1px solid #1e293b; }
    .dhead h1 { font-size:30px; margin:0; }
    .dhead .sub { color:#94a3b8; font-size:16px; margin-top:4px; }
    .clock { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
    .dot.off { } /* keep visible top-right */

    .stage { flex:1; display:grid; grid-template-columns: 1.6fr 1fr; gap:0; min-height:0; }
    .current { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; gap:18px; }
    .currentLabel { color:#94a3b8; letter-spacing:.18em; text-transform:uppercase; font-size:20px; }
    .bigwrap { text-align:center; }
    .bignum { font-size: clamp(110px, 20vw, 320px); font-weight:900; line-height:.95; letter-spacing:-.02em; }
    .bigroom { font-size: clamp(34px, 6vw, 84px); font-weight:800; margin-top:10px; }
    .bigsub { color:#94a3b8; font-size:24px; margin-top:8px; }
    .idle { color:#64748b; font-size:40px; font-weight:700; text-align:center; }

    .side { border-left:1px solid #1e293b; padding:26px 30px; display:flex; flex-direction:column; min-height:0; }
    .side h2 { color:#94a3b8; font-size:16px; letter-spacing:.1em; text-transform:uppercase; }
    .recent { list-style:none; margin:0; padding:0; overflow:hidden; flex:1; }
    .recent li { display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-bottom:1px solid #1e293b; font-size:30px; }
    .recent .rn { font-weight:900; }
    .recent .rr { color:#94a3b8; font-size:24px; }
    .waitcount { margin-top:14px; color:#94a3b8; font-size:18px; }

    .flash { animation: flash 1.1s ease-in-out 2; }
    @keyframes flash { 0%,100%{ background:transparent;} 50%{ background:rgba(37,99,235,.22);} }

    .soundbtn {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(2,6,23,.92); z-index:50; flex-direction:column; gap:18px; cursor:pointer;
    }
    .soundbtn .b { font-size:22px; font-weight:700; background:#2563eb; color:#fff; padding:18px 30px; border-radius:16px; }
  </style>
</head>
<body>
  <div class="soundbtn" id="enable">
    <div style="font-size:54px">🔊</div>
    <div class="b">Display starten &amp; Ton aktivieren</div>
    <div style="color:#94a3b8">Einmal tippen, dann im Vollbild (F11) lassen</div>
  </div>

  <div class="screen">
    <div class="dhead">
      <div>
        <h1 id="practice">Praxis</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div style="text-align:right">
        <div class="clock" id="clock">--:--</div>
        <div style="margin-top:6px"><span class="dot"></span></div>
      </div>
    </div>

    <div class="stage">
      <div class="current" id="current">
        <div class="idle">Bitte Platz nehmen.<br>Sie werden aufgerufen.</div>
      </div>
      <div class="side">
        <h2>Zuletzt aufgerufen</h2>
        <ul class="recent" id="recent"></ul>
        <div class="waitcount" id="waitcount"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/display.js"></script>
</body>
</html>
