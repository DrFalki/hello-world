<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mein Ticket</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background:#f1f5f9; }
    .pwrap { max-width:480px; margin:0 auto; padding:24px 18px; }
    .ticketcard { text-align:center; padding:30px 22px; }
    .pnum { font-size:96px; font-weight:900; line-height:1; }
    .pcat { color:var(--muted); font-size:16px; margin-top:6px; }
    .statebox { margin:22px 0; padding:18px; border-radius:16px; font-size:20px; font-weight:700; }
    .b-waiting { background:#fef9c3; color:#854d0e; }
    .b-called, .b-serving { background:#dcfce7; color:#166534; }
    .b-done, .b-skipped, .b-cancelled { background:#e2e8f0; color:#475569; }
    .ahead b { font-size:40px; display:block; }
    .pulse { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.04);} }
  </style>
</head>
<body>
  <div class="pwrap">
    <div class="card ticketcard">
      <div class="pcat" id="practice">Praxis</div>
      <div class="pnum" id="pnum" style="color:var(--brand)">–</div>
      <div class="pcat" id="pcat"></div>
      <div class="statebox b-waiting" id="statebox">Lädt …</div>
      <div class="ahead muted" id="ahead"></div>
    </div>
    <p class="muted" style="text-align:center; font-size:13px; margin-top:16px;">
      Diese Seite aktualisiert sich automatisch. Bitte halten Sie sie geöffnet.
    </p>
  </div>

  <script type="module" src="/js/ticket.js"></script>
</body>
</html>
